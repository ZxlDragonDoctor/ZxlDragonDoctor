name: Refresh profile assets

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      # --- Stats card ---
      - name: Generate dark statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged,reviews&rank_icon=github&theme=github_dark&hide_border=true"
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged,reviews&rank_icon=github&theme=default&hide_border=true"
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Top languages card ---
      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&exclude_repo=ZxlDragonDoctor&theme=github_dark&hide_border=true"
          path: profile/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&exclude_repo=ZxlDragonDoctor&theme=default&hide_border=true"
          path: profile/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Activity graph (31-day commit wave) ---
      - name: Generate activity graph (dark)
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=github&hide_border=true&area=true&color=7C3AED&line=a78bfa&point=ffffff&bg_color=0d1117&title_color=58A6FF&custom_title=Activity%20Graph" -o profile/activity-dark.svg

      - name: Generate activity graph (light)
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=github-compact&hide_border=true&area=true&color=7C3AED&line=a78bfa&point=333333&bg_color=ffffff&title_color=7C3AED&custom_title=Activity%20Graph" -o profile/activity-light.svg

      # --- GitHub Metrics (comprehensive panel) ---
      # Optional: needs a METRICS_TOKEN secret with repo/read:user/read:org.
      # continue-on-error so a missing PAT never blocks the other assets.
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output: profile/metrics.svg
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_independent: no
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_lines: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_contributions: yes
          base: header, activity, community, repositories, metadata
          config_display: color

      # --- Contribution snake ---
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            profile/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#0d1117,#1e1b4b,#312e81,#4c1d95,#7c3aed

      # --- Validate & commit ---
      - name: Validate generated cards
        shell: bash
        run: |
          set -euo pipefail
          invalid_count=0
          cards=(
            profile/stats-dark.svg
            profile/stats-light.svg
            profile/languages-dark.svg
            profile/languages-light.svg
            profile/activity-dark.svg
            profile/activity-light.svg
          )
          for card in "${cards[@]}"; do
            valid=true
            if [[ ! -s "$card" ]] || ! grep -q "<svg" "$card"; then
              echo "::warning file=$card::Empty or not SVG; preserving previous version"
              valid=false
            elif grep -Eqi "Something went wrong|Resource not accessible|Please try again later" "$card"; then
              echo "::warning file=$card::API error; preserving previous version"
              valid=false
            fi
            if [[ "$valid" == false ]]; then
              git restore --source=HEAD -- "$card" 2>/dev/null || true
              invalid_count=$((invalid_count + 1))
            fi
          done
          if (( invalid_count > 0 )); then
            echo "Preserved $invalid_count previously valid card(s)."
          fi

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"
          git push
